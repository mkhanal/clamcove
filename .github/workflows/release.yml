name: ClamCove Release

on:
  push:
    branches:
      - release/**
    tags:
      - "clamcove-*"
  pull_request:
    branches:
      - release/**

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  version:
    name: version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Source, README and NOTICE name one release, and the tag names it
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$REF_TYPE" = tag ]; then
            .github/dist/check-version.sh "$REF_NAME"
          else
            .github/dist/check-version.sh
          fi

  patches:
    name: release patches
    needs: version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Patches apply to the upstream source and give the release tree
        env:
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          if [ "$REF_TYPE" = tag ]; then
            [[ "$REF_NAME" =~ ^clamcove-([0-9]+\.[0-9]+\.[0-9]+)\.[0-9]+$ ]] \
              || { echo "tag $REF_NAME is not clamcove-<clamav version>.<n>"; exit 1; }
            release=$REF_NAME
            version=${BASH_REMATCH[1]}
          else
            release=HEAD
            version=$(sed -n '/^project( *ClamAV/,/)/ s/.*VERSION *"\([0-9][0-9.]*\)".*/\1/p' CMakeLists.txt | head -1)
            [ -n "$version" ] || { echo "cannot read the ClamAV version from CMakeLists.txt"; exit 1; }
          fi
          upstream="clamav-$version"
          git rev-parse --verify --quiet "$upstream^{commit}" > /dev/null \
            || { echo "upstream tag $upstream is not in this repository"; exit 1; }
          .github/dist/check-patches.sh "$upstream" "$release"

  source-tarball:
    name: source tarball
    needs: patches
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve the version
        run: |
          if [[ ! "$TAG" =~ ^clamcove-([0-9]+\.[0-9]+\.[0-9]+)\.([0-9]+)$ ]]; then
            echo "tag $TAG is not clamcove-<clamav version>.<n>"; exit 1
          fi
          echo "VERSION=${BASH_REMATCH[1]}" >> "$GITHUB_ENV"
          echo "OUT=clamcove-${BASH_REMATCH[1]}.${BASH_REMATCH[2]}" >> "$GITHUB_ENV"
          echo "REV=${BASH_REMATCH[1]}.${BASH_REMATCH[2]}" >> "$GITHUB_ENV"
          git rev-parse --verify --quiet "clamav-${BASH_REMATCH[1]}^{commit}" > /dev/null \
            || { echo "upstream tag clamav-${BASH_REMATCH[1]} is not in this repository"; exit 1; }

      - name: Download the official release and verify it
        run: .github/dist/fetch-official-source.sh "$VERSION" "$RUNNER_TEMP/official"

      - name: Apply the release branch changes
        run: |
          git diff --binary --no-renames --irreversible-delete "clamav-$VERSION^{commit}" "$TAG^{commit}" > "$RUNNER_TEMP/changes.patch"
          mkdir "$RUNNER_TEMP/src"
          tar -xzf "$RUNNER_TEMP/official/clamav-$VERSION.tar.gz" -C "$RUNNER_TEMP/src"
          mv "$RUNNER_TEMP/src/clamav-$VERSION" "$RUNNER_TEMP/src/$OUT"
          cd "$RUNNER_TEMP/src/$OUT"
          "$GITHUB_WORKSPACE/.github/dist/apply-patch.sh" "$RUNNER_TEMP/changes.patch"

      - name: Split the changes into patches
        run: |
          mkdir -p dist
          .github/dist/split-changes.sh "clamav-$VERSION" "$TAG" "$OUT" dist

      - name: No RARLAB file in the source or in any patch
        run: |
          .github/dist/check-no-rarlab.sh tree "$RUNNER_TEMP/src/$OUT"
          .github/dist/check-no-rarlab.sh patches dist/*.patch

      - name: Pack reproducibly
        run: |
          mkdir -p dist
          mtime=$(git log -1 --format=%ct "$TAG^{commit}")
          tar --sort=name --owner=0 --group=0 --numeric-owner --mtime="@$mtime" \
            -C "$RUNNER_TEMP/src" -cf - "$OUT" | gzip -n -9 > "dist/$OUT.tar.gz"
          (cd dist && sha256sum "$OUT.tar.gz" | tee "$OUT.tar.gz.sha256")
          mkdir "$RUNNER_TEMP/unpacked"
          tar -xzf "dist/$OUT.tar.gz" -C "$RUNNER_TEMP/unpacked"
          .github/dist/check-no-rarlab.sh tree "$RUNNER_TEMP/unpacked"
          cp .github/dist/apply-patch.sh dist/apply-patch.sh

      - name: Attach to the release
        run: |
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            {
              echo "ClamCove $REV, based on ClamAV $VERSION. Not affiliated with or endorsed by Cisco or the ClamAV project."
              echo
              echo "Complete corresponding source: \`$OUT.tar.gz\`, the official clamav-$VERSION.tar.gz with the changes of tag $TAG applied (SHA-256 in \`$OUT.tar.gz.sha256\`)."
              echo "Container images, for linux/amd64 and linux/arm64, with their digests below: \`ghcr.io/${GITHUB_REPOSITORY_OWNER}/clamcove:$REV\`, the complete drop-in replacement for ClamAV, \`ghcr.io/${GITHUB_REPOSITORY_OWNER}/clamcove:$REV-runtime\`, only \`clamd\` and \`clamdscan\` for running clamd as a service, and \`ghcr.io/${GITHUB_REPOSITORY_OWNER}/clamcove-updater:$REV\`, only \`freshclam\` on an empty base, keeping a signature folder current for clamd running elsewhere."
              echo "Source of the Debian packages in those images: \`$TAG-debian-sources.tar\`, every Debian source package at the exact version an image carries, with the list in \`SOURCES.txt\` (SHA-256 in \`$TAG-debian-sources.tar.sha256\`). Not needed to run ClamCove; download it when you need that source."
              echo
              echo "ClamCove contains no RARLAB unRAR code: no file of it is in the source, in any patch or in the image."
              echo
              echo "Patches to apply in order to the official source with \`apply-patch.sh\` (a patch records a deleted file without its text, so \`git apply\` alone refuses it), each the net diff of its change (changes that edit the same lines come as one patch):"
              cat dist/release-notes-patches.md
            } > dist/release-notes.md
            gh release create "$TAG" --verify-tag --title "ClamCove $REV" --notes-file dist/release-notes.md
          fi
          gh release upload "$TAG" "dist/$OUT.tar.gz" "dist/$OUT.tar.gz.sha256" dist/apply-patch.sh dist/*.patch

  images:
    name: container images (${{ matrix.arch }})
    needs: [patches, source-tarball]
    if: ${{ !cancelled() && needs.patches.result == 'success' && needs.source-tarball.result != 'failure' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    env:
      REF_TYPE: ${{ github.ref_type }}
      TAG: ${{ github.ref_name }}
      ARCH: ${{ matrix.arch }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Source to build
        run: |
          if [ "$REF_TYPE" = tag ]; then
            [[ "$TAG" =~ ^clamcove-([0-9]+\.[0-9]+\.[0-9]+\.[0-9]+)$ ]] || { echo "tag $TAG is not clamcove-<version>"; exit 1; }
            rev=${BASH_REMATCH[1]}
            mkdir -p "$RUNNER_TEMP/dl" "$RUNNER_TEMP/ctx"
            gh release download "$TAG" --pattern "$TAG.tar.gz*" --dir "$RUNNER_TEMP/dl"
            (cd "$RUNNER_TEMP/dl" && sha256sum -c "$TAG.tar.gz.sha256")
            tar -xzf "$RUNNER_TEMP/dl/$TAG.tar.gz" -C "$RUNNER_TEMP/ctx" --strip-components=1
            ctx=$RUNNER_TEMP/ctx
          else
            base=$(sed -n '/^project( *ClamAV/,/)/ s/.*VERSION *"\([0-9][0-9.]*\)".*/\1/p' CMakeLists.txt | head -1)
            release=$(sed -n 's/^set(CLAMCOVE_RELEASE  *"\([0-9][0-9]*\)".*/\1/p' CMakeLists.txt)
            [ -n "$base" ] && [ -n "$release" ] || { echo "cannot read the version from CMakeLists.txt"; exit 1; }
            rev=$base.$release
            ctx=$GITHUB_WORKSPACE
          fi
          echo "REV=$rev" >> "$GITHUB_ENV"
          echo "CTX=$ctx" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to the registry
        if: github.ref_type == 'tag'
        run: echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Build and check the drop-in, runtime and updater images
        run: |
          mkdir -p "$RUNNER_TEMP/digests" "$RUNNER_TEMP/debian"
          for kind in dropin runtime updater; do
            image="ghcr.io/${GITHUB_REPOSITORY_OWNER}/clamcove"
            [ "$kind" = updater ] && image=$image-updater
            if [ "$REF_TYPE" = tag ]; then
              docker buildx build --platform "linux/$ARCH" --target "$kind" -f .github/dist/Dockerfile \
                --build-arg "CLAMCOVE_REV=$REV" \
                --output "type=image,name=$image,push-by-digest=true,name-canonical=true,push=true" \
                --metadata-file "$RUNNER_TEMP/$kind.json" "$CTX"
              digest=$(jq -r '."containerimage.digest"' "$RUNNER_TEMP/$kind.json")
              docker pull "$image@$digest"
              docker tag "$image@$digest" "clamcove-check:$kind"
              echo "$digest" > "$RUNNER_TEMP/digests/$kind-$ARCH"
            else
              docker buildx build --platform "linux/$ARCH" --target "$kind" -f .github/dist/Dockerfile \
                --build-arg "CLAMCOVE_REV=$REV" --load -t "clamcove-check:$kind" "$CTX"
            fi
            .github/dist/check-image.sh "$kind" "clamcove-check:$kind" "$REV"
            .github/dist/debian-packages.sh "clamcove-check:$kind" >> "$RUNNER_TEMP/debian/packages-$ARCH.txt"
          done
          docker image ls clamcove-check

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: debian-packages-${{ matrix.arch }}
          path: ${{ runner.temp }}/debian/*
          if-no-files-found: error

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.ref_type == 'tag'
        with:
          name: digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error

  debian-sources:
    name: Debian sources of the images
    needs: images
    if: ${{ !cancelled() && needs.images.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      REF_TYPE: ${{ github.ref_type }}
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: debian-packages-*
          merge-multiple: true
          path: ${{ runner.temp }}/debian

      - name: Download every Debian source package the images carry, and attach them to the release
        run: |
          name=clamcove-check
          [ "$REF_TYPE" = tag ] && name=$TAG
          cat "$RUNNER_TEMP"/debian/packages-*.txt > "$RUNNER_TEMP/packages.txt"
          .github/dist/debian-sources.sh "$RUNNER_TEMP/packages.txt" "$RUNNER_TEMP/$name-debian-sources.tar"
          (cd "$RUNNER_TEMP" && sha256sum "$name-debian-sources.tar" > "$name-debian-sources.tar.sha256")
          if [ "$REF_TYPE" = tag ]; then
            gh release upload "$TAG" "$RUNNER_TEMP/$name-debian-sources.tar" "$RUNNER_TEMP/$name-debian-sources.tar.sha256" --clobber
          fi

  publish:
    name: publish images
    needs: [images, debian-sources]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
    env:
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digests-*
          merge-multiple: true
          path: ${{ runner.temp }}/digests

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Tag the multi-platform images and list their digests on the release
        run: |
          [[ "$TAG" =~ ^clamcove-([0-9]+\.[0-9]+\.[0-9]+\.[0-9]+)$ ]]
          REV=${BASH_REMATCH[1]}
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          newest_in() {
            git tag -l 'clamcove-*' | sed 's/^clamcove-//' | grep -E "^${1//./\\.}" | sort -V | tail -1
          }
          IFS=. read -r major minor patch _ <<< "$REV"
          listing="$RUNNER_TEMP/images.md"
          { echo; echo "Container image digests (linux/amd64 and linux/arm64):"; } > "$listing"
          for kind in dropin runtime updater; do
            image="ghcr.io/${GITHUB_REPOSITORY_OWNER}/clamcove"
            suffix=
            [ "$kind" = runtime ] && suffix=-runtime
            [ "$kind" = updater ] && image=$image-updater
            docker buildx imagetools create -t "$image:$REV$suffix" \
              "$image@$(cat "$RUNNER_TEMP/digests/$kind-amd64")" "$image@$(cat "$RUNNER_TEMP/digests/$kind-arm64")"
            digest=$(docker buildx imagetools inspect "$image:$REV$suffix" --format '{{json .Manifest}}' | jq -r .digest)
            echo "- \`$image:$REV$suffix\`: \`$digest\`" >> "$listing"
            for line in "$major.$minor.$patch." "$major.$minor." "$major." ""; do
              floating=${line%.}$suffix
              [ -z "${line%.}" ] && floating=${suffix#-}
              [ -z "$floating" ] && floating=latest
              if [ "$(newest_in "$line")" = "$REV" ]; then
                docker buildx imagetools create -t "$image:$floating" "$image:$REV$suffix"
              else
                echo "skipped: $image:$floating stays on a newer release"
              fi
            done
          done
          gh release view "$TAG" --json body --jq .body > "$RUNNER_TEMP/body.md"
          if ! grep -q '^Container image digests' "$RUNNER_TEMP/body.md"; then
            cat "$listing" >> "$RUNNER_TEMP/body.md"
            gh release edit "$TAG" --notes-file "$RUNNER_TEMP/body.md"
          fi
          cat "$listing"
