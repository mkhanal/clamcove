name: ClamCove RAR backend

on:
  push:
    branches:
      - release/**
  pull_request:
    branches:
      - release/**
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  sanitizers:
    name: asan-ubsan libarchive
    runs-on: ubuntu-24.04
    env:
      ASAN_OPTIONS: detect_leaks=0:abort_on_error=0:exitcode=99
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1:exitcode=99
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bison flex check libbz2-dev libcurl4-openssl-dev \
            libjson-c-dev libmilter-dev libncurses-dev libpcre2-dev libssl-dev libxml2-dev pkg-config python3-pytest zlib1g-dev

      - name: Configure
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DENABLE_EXAMPLES=OFF -DENABLE_MAN_PAGES=OFF
          -DCMAKE_INSTALL_PREFIX="$PWD/prefix"
          -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-sanitize=alignment -fno-omit-frame-pointer"
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-sanitize=alignment -fno-omit-frame-pointer"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
          -DCMAKE_SHARED_LINKER_FLAGS="-fsanitize=address,undefined"

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        working-directory: build
        run: |
          ctest --output-on-failure --parallel 4 --exclude-regex "^(clamd|libclamav|libclamav_rust)$"

      - name: Scan the RAR test set
        run: |
          cmake --install build
          mkdir -p sigs
          cp unit_tests/input/clamav.hdb sigs/
          if [ -d tools/rar-parity/signatures ]; then
            cp tools/rar-parity/signatures/* sigs/
          else
            echo "tools/rar-parity not present: scanning unit_tests fixtures only"
          fi
          export LD_LIBRARY_PATH="$PWD/prefix/lib"
          dirs="unit_tests/input unit_tests/clamscan"
          if [ -d tools/rar-parity/fixtures ]; then dirs="$dirs tools/rar-parity/fixtures"; fi
          rc=0
          for opt in "" "--alert-incomplete-rar=yes"; do
            if [ -n "$opt" ] && ! prefix/bin/clamscan --help | grep -q -- --alert-incomplete-rar; then
              echo "skipped: --alert-incomplete-rar not present"
              continue
            fi
            echo "== clamscan $opt"
            prefix/bin/clamscan -d sigs -r --alert-encrypted-archive=yes --alert-exceeds-max=yes $opt \
              --include='\.(rar|r[0-9][0-9]|exe|sfx)$|part[0-9]+\.rar$' $dirs > scan.log 2>&1 || rc=$?
            tail -5 scan.log
            if [ "$rc" -gt 2 ]; then echo "clamscan exit $rc"; exit 1; fi
            if grep -E "AddressSanitizer|runtime error:|UndefinedBehaviorSanitizer" scan.log; then exit 1; fi
            rc=0
          done

  parity:
    name: rar-parity
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check inputs
        id: inputs
        run: |
          if [ -f tools/rar-parity/compare.py ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "skipped: tools/rar-parity not present on this commit"
            echo "### skipped: tools/rar-parity not present" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Install dependencies
        if: steps.inputs.outputs.present == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bison flex check libbz2-dev libcurl4-openssl-dev \
            libjson-c-dev libmilter-dev libncurses-dev libpcre2-dev libssl-dev libxml2-dev pkg-config python3-pytest zlib1g-dev

      - name: Build and install the official ClamAV release, the reference
        if: steps.inputs.outputs.present == 'true'
        run: |
          version=$(sed -n '/^project( *ClamAV/,/)/ s/.*VERSION *"\([0-9][0-9.]*\)".*/\1/p' CMakeLists.txt | head -1)
          .github/dist/fetch-official-source.sh "$version" "$RUNNER_TEMP/official"
          tar -xzf "$RUNNER_TEMP/official/clamav-$version.tar.gz" -C "$RUNNER_TEMP"
          cmake -S "$RUNNER_TEMP/clamav-$version" -B "$RUNNER_TEMP/build-official" -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/opt/clamav-official \
            -DENABLE_EXAMPLES=OFF -DENABLE_MAN_PAGES=OFF -DENABLE_TESTS=OFF -DENABLE_CLAMONACC=OFF -DENABLE_MILTER=OFF
          cmake --build "$RUNNER_TEMP/build-official" --parallel
          sudo cmake --install "$RUNNER_TEMP/build-official"

      - name: Build and install with libarchive
        if: steps.inputs.outputs.present == 'true'
        run: |
          cmake -S . -B build-libarchive -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/opt/clamav-libarchive \
            -DENABLE_EXAMPLES=OFF -DENABLE_MAN_PAGES=OFF -DENABLE_TESTS=OFF -DENABLE_CLAMONACC=OFF -DENABLE_MILTER=OFF
          cmake --build build-libarchive --parallel
          sudo cmake --install build-libarchive

      - name: Compare without the incomplete-RAR alert
        if: steps.inputs.outputs.present == 'true'
        run: python3 tools/rar-parity/compare.py --a prefix:/opt/clamav-official --b prefix:/opt/clamav-libarchive --json parity.json

      - name: Compare with the incomplete-RAR alert
        if: ${{ !cancelled() && steps.inputs.outputs.present == 'true' }}
        run: |
          if ! /opt/clamav-libarchive/bin/clamscan --help | grep -q -- --alert-incomplete-rar; then
            echo "skipped: --alert-incomplete-rar not present on this commit"
            echo "### skipped: --alert-incomplete-rar not present" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          python3 tools/rar-parity/compare.py --a prefix:/opt/clamav-official --b prefix:/opt/clamav-libarchive \
            --b-extra-options=--alert-incomplete-rar=yes --json parity-alert.json

      - name: Upload parity results
        if: always() && steps.inputs.outputs.present == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rar-parity
          path: parity*.json
          if-no-files-found: ignore

  image:
    name: container image
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build the release image from the checkout
        run: docker build -f - --build-arg CLAMCOVE_REV=ci -t clamcove:ci . < .github/dist/Dockerfile

      - name: Smoke test
        run: |
          docker run --rm clamcove:ci clamscan --version
          docker run --rm clamcove:ci sh -c 'test -z "$(find / -xdev -name "libclamunrar.so*")" && test -n "$(find / -xdev -name "libclamunrar_iface.so*")"'
          docker run --rm clamcove:ci sh -c 'test -s /usr/share/doc/ClamAV/COPYING.libarchive && test -s /usr/share/doc/ClamAV/COPYING.rardecode'

      - name: No RARLAB file in any layer of the image
        run: .github/dist/check-no-rarlab.sh image clamcove:ci
